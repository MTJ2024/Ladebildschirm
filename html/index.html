<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENZONE420 — Enter The Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0f;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        .font-bebas {
            font-family: 'Bebas Neue', sans-serif;
        }
        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }

        /* Neon breathing animation */
        @keyframes neon-breathe {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.05); }
        }
        .animate-neon-breathe {
            animation: neon-breathe 3s infinite ease-in-out;
        }

        /* Glitch effect */
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, -1px); }
            98% { transform: translate(1px, 1px); }
        }
        .animate-glitch {
            animation: glitch 4s infinite;
        }

        /* Neon flicker */
        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.6; }
        }
        .animate-neon-flicker {
            animation: neon-flicker 3s infinite;
        }

        /* Floating particles */
        @keyframes float-up {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: scale(1); }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }
        .neon-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float-up linear infinite;
        }

        /* Scanlines */
        .scanlines {
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255,255,255,0.03) 2px,
                rgba(255,255,255,0.03) 4px
            );
        }

        /* Slide-in from left */
        @keyframes slide-in-left {
            0% { transform: translateX(-60px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slide-in-left 0.8s ease-out forwards;
        }

        /* Pulse glow for ready state */
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.1); }
            50% { text-shadow: 0 0 40px rgba(0, 240, 255, 0.8), 0 0 100px rgba(0, 240, 255, 0.3); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Stripe animation for loading bar */
        @keyframes stripe-move {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        /* Haze / mist drift animations for video overlay */
        @keyframes haze-drift-1 {
            0%   { transform: translateX(-10%) scale(1.1); opacity: 0.3; }
            50%  { transform: translateX(10%) scale(1.2); opacity: 0.2; }
            100% { transform: translateX(-10%) scale(1.1); opacity: 0.3; }
        }
        .animate-haze-drift-1 {
            animation: haze-drift-1 20s ease-in-out infinite;
        }

        @keyframes haze-drift-2 {
            0%   { transform: translateX(15%) translateY(-5%) scale(1.15); opacity: 0.25; }
            50%  { transform: translateX(-15%) translateY(5%) scale(1.05); opacity: 0.35; }
            100% { transform: translateX(15%) translateY(-5%) scale(1.15); opacity: 0.25; }
        }
        .animate-haze-drift-2 {
            animation: haze-drift-2 25s ease-in-out infinite;
        }

        @keyframes haze-drift-3 {
            0%   { transform: translateY(5%) scale(1.1); opacity: 0.2; }
            50%  { transform: translateY(-10%) scale(1.2); opacity: 0.15; }
            100% { transform: translateY(5%) scale(1.1); opacity: 0.2; }
        }
        .animate-haze-drift-3 {
            animation: haze-drift-3 18s ease-in-out infinite;
        }
    </style>
